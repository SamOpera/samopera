name: Latest articles

# Pulls my newest Medium posts into the README once a day.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@SamOpera"
          max_post_count: 5
          template: "- [$title]($url)$newline"
          commit_message: "Update latest articles"
          committer_username: "SamOpera"
          committer_email: "102769020+SamOpera@users.noreply.github.com"
